<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F6EFE5"><title>PTA BLOG | THE YOUNG CLUB</title><meta name="description" content="PTA career, education, clinical insights and life updates from THE YOUNG CLUB."><link rel="stylesheet" href="site.css"></head><body>
<header class="masthead"><div class="wrap navrow"><a class="brand" href="index.html">THE YOUNG CLUB</a><nav class="navlinks" aria-label="Main navigation"><a href="index.html">HOME</a><a href="blog.html" aria-current="page">PTA BLOG</a><a href="shop.html">APPAREL</a></nav></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">THE YOUNG CLUB / JOURNAL</div><h1>PTA BLOG</h1><p class="intro">Stories, notes and practical resources about the Physical Therapist Assistant journey, education and professional growth.</p></section><div class="controls"><input id="query" class="search" type="search" placeholder="Search articles..." aria-label="Search articles"><select id="category" class="filter" aria-label="Filter by category"><option value="">All categories</option></select></div><section class="posts" id="posts" aria-live="polite"><p class="status">Loading articles...</p></section></main>
<footer class="footer"><div class="wrap footrow"><span>© THE YOUNG CLUB · PTA BLOG</span><a href="index.html">Back to home</a></div></footer>
<script>
(function(){const postsEl=document.getElementById('posts'),search=document.getElementById('query'),category=document.getElementById('category');let posts=[];const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};const dateText=d=>{const date=new Date(String(d||'')+'T00:00:00');return Number.isNaN(date.getTime())?String(d||''):date.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})};function render(){const q=search.value.trim().toLowerCase(),cat=category.value,filtered=posts.filter(p=>(!q||(p.title+' '+p.summary+' '+p.category).toLowerCase().includes(q))&&(!cat||p.category===cat));postsEl.replaceChildren();if(!filtered.length){postsEl.append(el('p','status',posts.length?'No articles match your search.':'No articles yet. Check back soon.'));return}filtered.forEach(p=>{const a=el('a','post-card');a.href='post.html?id='+encodeURIComponent(p.id);const content=el('div');content.append(el('span','post-category',p.category||'PTA BLOG'),el('h2','',p.title),el('p','',p.summary||''));a.append(content,el('time','date',dateText(p.date)));if(p.cover){const img=el('img','post-cover');img.loading='lazy';img.alt='';img.src=p.cover;a.append(img)}postsEl.append(a)})}fetch('posts.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Invalid article list');posts=data.filter(p=>p&&p.id&&p.title).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));[...new Set(posts.map(p=>p.category).filter(Boolean))].sort().forEach(c=>{const opt=el('option','',c);opt.value=c;category.append(opt)});render()}).catch(()=>{postsEl.replaceChildren(el('p','status','Could not load articles. Please refresh the page.'))});search.addEventListener('input',render);category.addEventListener('change',render)})();
</script></body></html>
