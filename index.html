<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6EFE5">
  <meta name="description" content="THE YOUNG CLUB — PTA Blog and Apparel">
  <title>THE YOUNG CLUB</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #F6EFE5; }
    .page { min-height: 100svh; display: grid; place-items: center; }
    .artwork { width: 100%; max-width: 1582px; position: relative; }
    .artwork img { width: 100%; height: auto; display: block; }
    .destination { position: absolute; left: 0; right: 0; display: block; cursor: pointer; }
    .destination:focus-visible { outline: 3px solid #1B3A2E; outline-offset: -8px; }
    .blog { top: 0; height: 52%; }
    .apparel { top: 52%; bottom: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .destination { transition: background-color 0.2s ease; }
      .destination:hover { background-color: rgba(27,58,46,0.018); }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="artwork">
      <img src="homepage-final.png" alt="Upper: sprout and PTA BLOG. Lower: TYC, THE YOUNG CLUB, and APPAREL." width="1582" height="994">
      <a class="destination blog" href="blog.html" aria-label="Open the PTA Blog" title="PTA Blog"></a>
      <a class="destination apparel" href="shop.html" aria-label="Open THE YOUNG CLUB Apparel" title="Apparel"></a>
    </div>
  </main>
</body>
</html>
