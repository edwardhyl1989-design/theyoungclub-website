<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="THE YOUNG CLUB — explore the journal and apparel collection.">
  <title>THE YOUNG CLUB</title>
  <style>
    :root { --green:#003d2d; --cream:#f6efe5; }
    * {box-sizing:border-box}
    html,body {margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#003b2c;color:var(--cream)}
    main { min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:20px 0 }
    .hero {display:block;position:relative;width:min(100%,2172px);margin-inline:auto;}
    .hero img {width:100%;height:auto;display:block}
    .area {position:absolute;display:block;top:19%;height:59%;z-index:2;border-radius:5px;outline-offset:5px}
    .area:hover {box-shadow: inset 0 0 0 2px rgba(246,239,229,.35)}
    .area:focus-visible {outline:3px solid var(--cream)}
    .blog {left:8%;width:47%}
    .tyc {left:59%;width:15%}
    .emblem {left:78%;width:17%}
    .hint {font:13px/1.6 system-ui,-apple-system,sans-serif;letter-spacing:.06em;color:#e5e5db;text-align:center;margin:0 20px}
    .mobile-links {display:none}
    @media (max-width:680px) {
      main {padding:30px 14px;gap:26px}
      .hero .area {display:none}
      .hero img {border-radius:3px}
      .mobile-links {display:grid;gap:12px;width:min(100%,410px)}
      .mobile-links a {display:block;text-decoration:none;border:1px solid rgba(246,239,229,.48);padding:18px;text-align:center;color:var(--cream);font-size:18px;letter-spacing:.06em}
      .mobile-links a span {display:block;font:11px system-ui,sans-serif;color:#dddfd6;letter-spacing:.16em;margin-top:7px}
    }
    @media (prefers-reduced-motion:no-preference){.area,.mobile-links a{transition:box-shadow .18s ease,background .18s ease}.mobile-links a:hover{background:rgba(246,239,229,.1)}}
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <img src="theyoungclub-hero.png" alt="THE YOUNG CLUB wordmark, TYC monogram and EST. 2028 emblem">
      <a class="area blog" href="blog.html" aria-label="THE YOUNG CLUB — open the journal" title="Explore the journal"></a>
      <a class="area tyc" href="shop.html" aria-label="TYC — open the apparel page" title="Explore apparel"></a>
      <a class="area emblem" href="shop.html" aria-label="EST. 2028 emblem — open the apparel page" title="Explore apparel"></a>
    </div>
    <p class="hint">THE YOUNG CLUB → JOURNAL &nbsp; · &nbsp; TYC / EMBLEM → APPAREL</p>
    <nav class="mobile-links" aria-label="Sections">
      <a href="blog.html">THE YOUNG CLUB<span>JOURNAL & ARTICLES</span></a>
      <a href="shop.html">TYC · EST. 2028<span>APPAREL & COLLECTIONS</span></a>
    </nav>
  </main>
</body>
</html>
