<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F1E9">
<meta name="description" content="The Young Club — Explore the PTA Blog and the Shop. Stories, connection, and thoughtfully designed products.">
<title>THE YOUNG CLUB</title>
<link rel="stylesheet" href="site-visits.css">
<link rel="stylesheet" href="legal-footer.css">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F8F1E9}
body{color:#0B4232;font-family:Georgia,'Times New Roman',serif}
main{min-height:calc(100svh - 82px);display:grid;place-items:center}
.home-art{position:relative;width:min(100%,1547px,calc(95svh * 1.52114));margin:auto}
.home-art img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.home-zone{position:absolute;left:0;width:100%;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.home-zone.blog{top:0;height:46%}
.home-zone.shop{top:46%;height:54%}
.home-zone:focus-visible{outline:3px solid #0B4232;outline-offset:-5px}
.home-footer{padding:6px 15px 18px;text-align:center;background:#F8F1E9}
.home-footer .tyc-legal-links{margin:10px auto 4px}
.home-footer .tyc-visitor-micro{margin:4px auto 0}
@media(max-width:600px){
  main{min-height:calc(100svh - 110px)}
  .home-art{width:100%}
  .home-footer{padding:10px 9px 22px}
}
</style>
</head>
<body>
<main>
  <div class="home-art">
    <img src="homepage-approved.svg" width="1547" height="1017" alt="The Young Club — upper sprout and PTA Blog, thin gray line, TYC botanical monogram, The Young Club wordmark with a small sprout Y, and Shop.">
    <a class="home-zone blog" href="blog.html" aria-label="Explore PTA Blog" title="PTA BLOG"></a>
    <a class="home-zone shop" href="shop.html" aria-label="Explore The Young Club Shop" title="SHOP"></a>
  </div>
</main>
<footer class="home-footer">
  <span class="tyc-visitor-micro" data-tyc-visitor-stats hidden aria-label="Site visitors, today and all time">TODAY <span data-tyc-today>—</span><span class="tyc-visitor-divider">·</span>TOTAL <span data-tyc-total>—</span></span>
  <nav class="tyc-legal-links" aria-label="The Young Club information"><a href="about.html">About</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a></nav>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="site-visits.js"></script>
</body>
</html>
