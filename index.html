<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020202">
<meta name="description" content="The Young Club — Explore the PTA Blog and the Shop. Stories, connection, and thoughtfully designed products.">
<title>THE YOUNG CLUB</title>
<link rel="stylesheet" href="site-visits.css">
<link rel="stylesheet" href="legal-footer.css">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#FCF4EF}
body{color:#083F32;font-family:Georgia,'Times New Roman',serif}
main{min-height:calc(100svh - 82px);display:grid;place-items:center;background:#FCF4EF;overflow:hidden}
.home-art{position:relative;width:min(100%,1672px,calc(96svh * 1.77683));aspect-ratio:1672 / 941;margin:auto;isolation:isolate}
/* Extend the original artwork's black-to-cream backdrop to both viewport edges without resizing the logos or changing link zones. */
.home-art::before{content:"";position:absolute;z-index:-1;pointer-events:none;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:linear-gradient(to bottom,#050505 0%,#080808 20%,#292929 33%,#a8a19c 46%,#e9e1db 57%,#FCF4EF 76%,#FCF4EF 100%)}
.home-image{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%)}
.home-zone{position:absolute;left:0;width:100%;display:block;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
.home-zone.blog{top:0;height:40%}
.home-zone.shop{top:40%;height:60%}
.home-zone:focus-visible{outline:3px solid #22DBA3;outline-offset:-5px}
.home-zone::after{content:"";position:absolute;left:12%;right:12%;bottom:3%;height:2px;border-radius:3px;opacity:0;transform:scaleX(.82);transition:opacity .28s ease,transform .32s ease;background:linear-gradient(90deg,transparent,rgba(12,110,83,.48),transparent);pointer-events:none}
.home-zone.blog::after{background:linear-gradient(90deg,transparent,rgba(87,255,200,.55),transparent)}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
 .home-zone:hover::after,.home-zone:focus-visible::after{opacity:1;transform:scaleX(1)}
}
@media(prefers-reduced-motion:reduce){.home-zone::after{transition:none}}
.home-footer{padding:6px 15px 18px;text-align:center;background:#FCF4EF}
.home-footer .tyc-legal-links{margin:10px auto 4px}
.home-footer .tyc-visitor-micro{margin:4px auto 0}
@media(max-width:640px){
 main{min-height:calc(100svh - 92px);align-content:center}
 .home-art{width:100%;aspect-ratio:1672 / 941}
 .home-footer{padding:10px 9px 22px}
}
</style>

<link rel="icon" type="image/svg+xml" href="/tyc-sprout-mark.svg">
<link rel="canonical" href="https://theyoungclub.com/">
<meta property="og:type" content="website"><meta property="og:site_name" content="THE YOUNG CLUB"><meta property="og:title" content="THE YOUNG CLUB"><meta property="og:description" content="The Young Club — Stories, community, opportunity and the Shop."><meta property="og:url" content="https://theyoungclub.com/"><meta name="twitter:card" content="summary">
</head>
<body>
<main>
  <div class="home-art">
    <a class="home-zone blog" href="blog.html" aria-label="Explore PTA Blog" title="PTA BLOG"></a>
    <a class="home-zone shop" href="shop.html" aria-label="Explore The Young Club Shop" title="SHOP"></a>
    <img class="home-image" src="homepage-reference-original.png" width="1672" height="941" loading="eager" fetchpriority="high" decoding="async" draggable="false" alt="The Young Club homepage: neon sprout, PTA Blog, TYC monogram, layered The Young Club wordmark, and Shop on a black-to-cream gradient">
  </div>
</main>
<footer class="home-footer">
  <span class="tyc-visitor-micro" data-tyc-visitor-stats hidden aria-label="Site visitors, today and all time">TODAY <span data-tyc-today>—</span><span class="tyc-visitor-divider">·</span>TOTAL <span data-tyc-total>—</span></span>
  <nav class="tyc-legal-links" aria-label="The Young Club information"><a href="about.html">About</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Use</a></nav>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="site-visits.js"></script>
</body>
</html>
