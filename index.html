<title>THE YOUNG CLUB</title>

<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F8F1E9}
body{color:#0B4232;font-family:Georgia,'Times New Roman',serif}
main{min-height:calc(100svh - 82px);display:grid;place-items:center}
.home-art{position:relative;width:min(100%,1547px,calc(95svh * 1.52114));aspect-ratio:1547 / 1017;margin:auto;isolation:isolate}
.home-illustration{display:block;width:100%;height:auto;pointer-events:none}
.home-illustration .blog-word,.home-illustration .blog-sprout,
.home-illustration .brand-word,.home-illustration .brand-sprout,
.home-illustration .tyc-monogram,.home-illustration .shop-word{
 transition:transform .48s cubic-bezier(.2,.7,.25,1);
 transform-box:fill-box;transform-origin:center
}
.home-zone{position:absolute;left:0;width:100%;display:block;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
.home-zone.blog{top:0;height:46%}
.home-zone.shop{top:46%;height:54%}
.home-zone:focus-visible{outline:3px solid #0B4232;outline-offset:-5px}
@media(hover:hover) and (prefers-reduced-motion:no-preference){
 .home-zone.blog:hover ~ .home-illustration .blog-word,
 .home-zone.blog:hover ~ .home-illustration .blog-sprout,
 .home-zone.blog:focus-visible ~ .home-illustration .blog-word,
 .home-zone.blog:focus-visible ~ .home-illustration .blog-sprout{transform:translateY(-5px)}
 .home-zone.shop:hover ~ .home-illustration .brand-word,
 .home-zone.shop:hover ~ .home-illustration .brand-sprout,
 .home-zone.shop:hover ~ .home-illustration .tyc-monogram,
 .home-zone.shop:hover ~ .home-illustration .shop-word,
 .home-zone.shop:focus-visible ~ .home-illustration .brand-word,
 .home-zone.shop:focus-visible ~ .home-illustration .brand-sprout,
 .home-zone.shop:focus-visible ~ .home-illustration .tyc-monogram,
 .home-zone.shop:focus-visible ~ .home-illustration .shop-word{transform:translateY(-5px)}
}
@media(prefers-reduced-motion:reduce){
 .home-illustration .blog-word,.home-illustration .blog-sprout,
 .home-illustration .brand-word,.home-illustration .brand-sprout,
 .home-illustration .tyc-monogram,.home-illustration .shop-word{transition:none}
}
.home-footer{padding:6px 15px 18px;text-align:center;background:#F8F1E9}
.home-footer .tyc-legal-links{margin:10px auto 4px}
.home-footer .tyc-visitor-micro{margin:4px auto 0}
@media(max-width:600px){
  main{min-height:calc(100svh - 110px)}
  .home-art{width:100%}
  .home-footer{padding:10px 9px 22px}
}
</style>
</head>
