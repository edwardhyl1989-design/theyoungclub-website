}

.home-footer{padding:6px 15px 18px;text-align:center;background:#FCF4EF}
.home-footer .tyc-legal-links{margin:10px auto 4px}
.home-footer .tyc-visitor-micro{margin:4px auto 0}
@media(max-width:640px){
main{min-height:calc(100svh - 92px);align-content:center}
.home-art{width:100%;aspect-ratio:1672 / 941}
.home-illustration .blog-mark text{transform:scale(2.65);transform-box:fill-box;transform-origin:center}
.home-illustration .shop-mark{transform:scale(2.65)}
.home-zone.blog{height:41%}
.home-zone.shop{top:41%;height:59%}
.home-footer{padding:10px 9px 22px}
}
</style>
