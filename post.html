<script>
(function(){const root=document.getElementById('post-root'),cb=document.getElementById('comment-box');const id=new URLSearchParams(location.search).get('id');const el=(t,c,s)=>{const n=document.createElement(t);if(c)n.className=c;if(s!==undefined)n.textContent=s;return n};function safeUrl(v,kind){try{const u=new URL(v,location.href);return (u.protocol==='https:'||u.protocol==='http:'||(kind==='img'&&u.protocol==='data:'&&v.startsWith('data:image/')))?u.href:null}catch{return null}}function cleanHtml(html){const parser=new DOMParser(),source=parser.parseFromString(String(html||''),'text/html'),allowed=new Set(['P','BR','H2','H3','H4','STRONG','B','EM','I','U','S','UL','OL','LI','BLOCKQUOTE','A','IMG','HR','PRE','CODE']);function scrub(node){if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();if(!allowed.has(node.tagName)){if(['SCRIPT','STYLE','IFRAME','SVG','FORM','OBJECT','EMBED'].includes(node.tagName))return document.createDocumentFragment();const frag=document.createDocumentFragment();[...node.childNodes].forEach(child=>frag.append(scrub(child)));return frag}const out=document.createElement(node.tagName.toLowerCase());if(node.tagName==='A'){const href=safeUrl(node.getAttribute('href'),'link');if(href){out.href=href;out.rel='noopener noreferrer';out.target='_blank'}}if(node.tagName==='IMG'){const src=safeUrl(node.getAttribute('src'),'img');if(!src)return document.createDocumentFragment();out.src=src;out.alt=node.getAttribute('alt')||'';out.loading='lazy'}[...node.childNodes].forEach(child=>out.append(scrub(child)));return out}const frag=document.createDocumentFragment();[...source.body.childNodes].forEach(child=>frag.append(scrub(child)));return frag}function render(p){root.replaceChildren();const meta=el('div','eyebrow',p.category||'PTA BLOG'),h=el('h1','',p.title),date=el('div','meta',p.date||'');root.append(meta,h,date);const views=el('span','tyc-view-count tyc-view-count-detail','👁 — views');root.append(views);if(window.TYC_Views)window.TYC_Views.record('blog',p.id).then(count=>{if(count!==null)views.textContent=window.TYC_Views.label(count)});document.title=p.title+' | PTA BLOG';if(p.cover){const src=safeUrl(p.cover,'img');if(src){const img=el('img','article-cover');img.src=src;img.alt='';root.append(img)}}const body=el('div','article-body');const content=cleanHtml(p.body);if(p.cover){const coverUrl=safeUrl(p.cover,'img');if(coverUrl){for(const img of content.querySelectorAll('img')){if(img.src===coverUrl){const parent=img.parentElement;img.remove();if(parent&&parent.tagName==='P'&&!parent.textContent.trim()&&!parent.querySelector('img,video,iframe'))parent.remove();}}}}body.append(content);root.append(body)}function renderRelated(current,all){
 const section=document.getElementById('related-articles'),list=document.getElementById('related-list');
 const others=all.filter(p=>p&&typeof p.id==='string'&&p.id!==current.id&&typeof p.title==='string'&&p.title.trim());
 // Prioritize the same category, then most recent date; omit current post.
 others.sort((a,b)=>Number(b.category===current.category)-Number(a.category===current.category)||String(b.date||'').localeCompare(String(a.date||''))||a.title.localeCompare(b.title));
 const seen=new Set();
 const picks=others.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true}).slice(0,3);
 if(!picks.length){section.hidden=true;return}
 list.replaceChildren();
 picks.forEach(p=>{const a=el('a','related-entry');a.href='post.html?id='+encodeURIComponent(p.id);
   a.append(el('span','related-entry-title',p.title));
   a.append(el('span','related-entry-meta',[p.category,p.date].filter(Boolean).join(' · ')));
   list.append(a)});
 section.hidden=false;
} function comments(p){if(window.TYC_mountBlogGuestComments){window.TYC_mountBlogGuestComments(p)}else{cb.textContent="Comments are temporarily unavailable."}}if(!id){root.replaceChildren(el('p','status','No article selected.'));document.getElementById('comments').hidden=true;return}window.TYC_BlogData.all().then(items=>{const p=Array.isArray(items)?items.find(item=>item.id===id):null;if(!p){root.replaceChildren(el('p','status','Article not found.'));document.getElementById('comments').hidden=true;return}render(p);renderRelated(p,items);comments(p)}).catch(()=>{root.replaceChildren(el('p','status','Could not load this article. Please refresh.'));document.getElementById('comments').hidden=true})})();
</script></body></html>
