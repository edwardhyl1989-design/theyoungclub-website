<script>
(function(){const root=document.getElementById('post-root'),cb=document.getElementById('comment-box');const id=new URLSearchParams(location.search).get('id');const el=(t,c,s)=>{const n=document.createElement(t);if(c)n.className=c;if(s!==undefined)n.textContent=s;return n};function safeUrl(v,kind){try{const u=new URL(v,location.href);return (u.protocol==='https:'||u.protocol==='http:'||(kind==='img'&&u.protocol==='data:'&&v.startsWith('data:image/')))?u.href:null}catch{return null}}function cleanHtml(html){const parser=new DOMParser(),source=parser.parseFromString(String(html||''),'text/html'),allowed=new Set(['P','BR','H2','H3','H4','STRONG','B','EM','I','U','S','UL','OL','LI','BLOCKQUOTE','A','IMG','HR','PRE','CODE']);function scrub(node){if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();if(!allowed.has(node.tagName)){if(['SCRIPT','STYLE','IFRAME','SVG','FORM','OBJECT','EMBED'].includes(node.tagName))return document.createDocumentFragment();const frag=document.createDocumentFragment();[...node.childNodes].forEach(child=>frag.append(scrub(child)));return frag}const out=document.createElement(node.tagName.toLowerCase());if(node.tagName==='A'){const href=safeUrl(node.getAttribute('href'),'link');if(href){out.href=href;out.rel='noopener noreferrer';out.target='_blank'}}if(node.tagName==='IMG'){const src=safeUrl(node.getAttribute('src'),'img');if(!src)return document.createDocumentFragment();out.src=src;out.alt=node.getAttribute('alt')||'';out.loading='lazy'}[...node.childNodes].forEach(child=>out.append(scrub(child)));return out}const frag=document.createDocumentFragment();[...source.body.childNodes].forEach(child=>frag.append(scrub(child)));return frag}function render(p){root.replaceChildren();const meta=el('div','eyebrow',p.category||'PTA BLOG'),h=el('h1','',p.title),date=el('div','meta',p.date||'');root.append(meta,h,date);document.title=p.title+' | PTA BLOG';if(p.cover){const src=safeUrl(p.cover,'img');if(src){const img=el('img','article-cover');img.src=src;img.alt='';root.append(img)}}const body=el('div','article-body');body.append(cleanHtml(p.body));root.append(body)}function comments(p){fetch('site-config.json',{cache:'no-store'}).then(r=>r.json()).then(s=>{const shortname=String(s.disqus_shortname||'').trim();if(!/^[a-z0-9-]+$/i.test(shortname)){cb.textContent='Comments are being set up. Please check back soon.';return}cb.className='';cb.textContent='';const holder=el('div');holder.id='disqus_thread';cb.append(holder);window.disqus_config=function(){this.page.url=location.origin+location.pathname+'?id='+encodeURIComponent(p.id);this.page.identifier='pta-blog-'+p.id;this.page.title=p.title};const sc=document.createElement('script');sc.src='https://'+shortname+'.disqus.com/embed.js';sc.async=true;sc.setAttribute('data-timestamp',String(+new Date()));sc.onerror=()=>{cb.textContent='Comments cannot be loaded right now.'};document.body.append(sc)}).catch(()=>{cb.textContent='Comments are temporarily unavailable.'})}if(!id){root.replaceChildren(el('p','status','No article selected.'));document.getElementById('comments').hidden=true;return}fetch('posts.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{const p=Array.isArray(items)?items.find(item=>item.id===id):null;if(!p){root.replaceChildren(el('p','status','Article not found.'));document.getElementById('comments').hidden=true;return}render(p);comments(p)}).catch(()=>{root.replaceChildren(el('p','status','Could not load this article. Please refresh.'));document.getElementById('comments').hidden=true})})();
</script></body></html>
