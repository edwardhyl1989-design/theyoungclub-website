<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F6EFE5"><title>Article | PTA BLOG | THE YOUNG CLUB</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="blog-comments.css"><style>
/* Only the related-articles area is new; existing site styles stay intact. */
.related-articles{border-top:1px solid var(--line,#d5d3cc);padding-top:22px;margin:0 0 34px}
.related-articles h2{font-size:25px;margin:0 0 13px}
.related-entry{display:block;text-decoration:none;border-bottom:1px solid var(--line,#d5d3cc);padding:15px 3px 15px 0;transition:padding-left .25s ease}
.related-entry:hover{padding-left:7px}
.related-entry:focus-visible{outline:2px solid var(--green,#1B3A2E);outline-offset:3px}
.related-entry:last-child{border-bottom:0}
.related-entry-title{display:block;font-family:Georgia,'Times New Roman',serif;font-size:21px;line-height:1.4;color:var(--green,#1B3A2E)}
.related-entry-meta{display:block;font-size:11px;letter-spacing:.07em;color:var(--muted,#70756e);margin:5px 0 0}
@media (prefers-reduced-motion:reduce){.related-entry{transition:none}}
</style></head><body>
<header class="masthead"><div class="wrap navrow"><a class="brand" href="index.html">THE YOUNG CLUB</a><nav class="navlinks" aria-label="Main navigation"><a href="index.html">HOME</a><a href="blog.html">PTA BLOG</a><a href="community.html">PTA COMMUNITY</a><a href="jobs.html">JOB POSTINGS</a><a href="shop.html">APPAREL</a><a class="blog-login-link" href="community.html" aria-label="Log in or sign up with your The Young Club account">Log In</a></nav></div></header>
<main class="wrap"><article class="article"><a class="back" href="blog.html">← ALL ARTICLES</a><div id="post-root"><p class="status">Loading article...</p></div><section class="related-articles" id="related-articles" aria-labelledby="related-title" hidden><h2 id="related-title">Related Articles</h2><div id="related-list"></div></section><section class="commentarea" id="comments" aria-labelledby="comment-title"><h2 id="comment-title">Questions &amp; Comments</h2><div id="comment-box" class="comments-off">Loading comments...</div></section></article></main><footer class="footer"><div class="wrap footrow"><span>© THE YOUNG CLUB · PTA BLOG</span><a href="blog.html">All articles</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="blog-comments.js"></script>
<script>
(function(){const root=document.getElementById('post-root'),cb=document.getElementById('comment-box');const id=new URLSearchParams(location.search).get('id');const el=(t,c,s)=>{const n=document.createElement(t);if(c)n.className=c;if(s!==undefined)n.textContent=s;return n};function safeUrl(v,kind){try{const u=new URL(v,location.href);return (u.protocol==='https:'||u.protocol==='http:'||(kind==='img'&&u.protocol==='data:'&&v.startsWith('data:image/')))?u.href:null}catch{return null}}function cleanHtml(html){const parser=new DOMParser(),source=parser.parseFromString(String(html||''),'text/html'),allowed=new Set(['P','BR','H2','H3','H4','STRONG','B','EM','I','U','S','UL','OL','LI','BLOCKQUOTE','A','IMG','HR','PRE','CODE']);function scrub(node){if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent);if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();if(!allowed.has(node.tagName)){if(['SCRIPT','STYLE','IFRAME','SVG','FORM','OBJECT','EMBED'].includes(node.tagName))return document.createDocumentFragment();const frag=document.createDocumentFragment();[...node.childNodes].forEach(child=>frag.append(scrub(child)));return frag}const out=document.createElement(node.tagName.toLowerCase());if(node.tagName==='A'){const href=safeUrl(node.getAttribute('href'),'link');if(href){out.href=href;out.rel='noopener noreferrer';out.target='_blank'}}if(node.tagName==='IMG'){const src=safeUrl(node.getAttribute('src'),'img');if(!src)return document.createDocumentFragment();out.src=src;out.alt=node.getAttribute('alt')||'';out.loading='lazy'}[...node.childNodes].forEach(child=>out.append(scrub(child)));return out}const frag=document.createDocumentFragment();[...source.body.childNodes].forEach(child=>frag.append(scrub(child)));return frag}function render(p){root.replaceChildren();const meta=el('div','eyebrow',p.category||'PTA BLOG'),h=el('h1','',p.title),date=el('div','meta',p.date||'');root.append(meta,h,date);document.title=p.title+' | PTA BLOG';if(p.cover){const src=safeUrl(p.cover,'img');if(src){const img=el('img','article-cover');img.src=src;img.alt='';root.append(img)}}const body=el('div','article-body');body.append(cleanHtml(p.body));root.append(body)}function renderRelated(current,all){
 const section=document.getElementById('related-articles'),list=document.getElementById('related-list');
 const others=all.filter(p=>p&&typeof p.id==='string'&&p.id!==current.id&&typeof p.title==='string'&&p.title.trim());
 // Prioritize the same category, then most recent date; omit current post.
 others.sort((a,b)=>Number(b.category===current.category)-Number(a.category===current.category)||String(b.date||'').localeCompare(String(a.date||''))||a.title.localeCompare(b.title));
 const seen=new Set();
 const picks=others.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true}).slice(0,3);
 if(!picks.length){section.hidden=true;return}
 list.replaceChildren();
 picks.forEach(p=>{const a=el('a','related-entry');a.href='post.html?id='+encodeURIComponent(p.id);
   a.append(el('span','related-entry-title',p.title));
   a.append(el('span','related-entry-meta',[p.category,p.date].filter(Boolean).join(' · ')));
   list.append(a)});
 section.hidden=false;
} function comments(p){if(window.TYC_mountBlogGuestComments){window.TYC_mountBlogGuestComments(p)}else{cb.textContent="Comments are temporarily unavailable."}}if(!id){root.replaceChildren(el('p','status','No article selected.'));document.getElementById('comments').hidden=true;return}fetch('posts.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{const p=Array.isArray(items)?items.find(item=>item.id===id):null;if(!p){root.replaceChildren(el('p','status','Article not found.'));document.getElementById('comments').hidden=true;return}render(p);renderRelated(p,items);comments(p)}).catch(()=>{root.replaceChildren(el('p','status','Could not load this article. Please refresh.'));document.getElementById('comments').hidden=true})})();
</script></body></html>
